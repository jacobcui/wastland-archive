    <path d="M100 230 l16 -14 l5 20 l20 -6 l-6 20 l20 3 l-18 12 l12 16 l-21 -7 l-2 21 l-14 -16 l-11 16 l-3 -21 l-20 7 l12 -16 l-19 -12 l21 -3 l-6 -20 z"/>
    <path d="M340 300 l10 -9 l3 13 l13 -4 l-4 13 l13 2 l-12 8 l8 10 l-14 -4 l-1 14 l-9 -11 l-7 11 l-2 -14 l-13 4 l8 -10 l-12 -8 l14 -2 l-4 -13 z" opacity="0.6"/>
  </g>

  <rect width="1920" height="1080" fill="url(#dots)" opacity="0.3"/>
  <rect width="1920" height="1080" fill="url(#scratch)" opacity="0.5"/>
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.55"/>
  <rect y="700" width="1920" height="380" fill="#080605" opacity="0.25"/>
</svg>