  <path d="M0 1080 L760 690 L1080 690 L1920 1080 Z" fill="url(#road)" stroke="#0b0906" stroke-width="14"/>
  <path d="M800 700 L780 1080 M1040 700 L1080 1080" stroke="#d8b35a" stroke-width="10" stroke-dasharray="46 38" opacity="0.8"/>
  <path d="M400 1080 L820 700 M1450 1080 L1070 700" stroke="#0b0906" stroke-width="5" opacity="0.45" fill="none"/>

  <g transform="translate(1110 600)">
    <path d="M-120 90 L-80 20 L40 0 L150 30 L220 100 L210 160 L-130 170 Z" fill="url(#car)" stroke="#0b0906" stroke-width="10"/>
    <path d="M-50 22 L10 -40 L100 -20 L140 25 Z" fill="#2a2520" stroke="#0b0906" stroke-width="8"/>
    <path d="M5 -28 L45 -15 L30 18 L-20 20 Z M65 -15 L120 5 L105 25 L55 22 Z" fill="#567b7a" stroke="#0b0906" stroke-width="5"/>
    <circle cx="-70" cy="155" r="42" fill="#14110e" stroke="#0b0906" stroke-width="10"/>
    <circle cx="160" cy="155" r="42" fill="#14110e" stroke="#0b0906" stroke-width="10"/>
    <path d="M-220 95 L-100 85 L-80 120 L-230 130 Z" fill="#7a5a36" stroke="#0b0906" stroke-width="8"/>
    <path d="M-70 60 L150 50" stroke="#0b0906" stroke-width="5" opacity="0.7"/>
    <path d="M220 100 L260 70 L300 72 L320 120 L250 140 Z" fill="#243c3a" stroke="#0b0906" stroke-width="8"/>
  </g>

  <g stroke="#0b0906" stroke-width="8" fill="none">
    <path d="M0 860 L180 760 L240 860 L420 750 L500 850"/>
    <path d="M1500 870 L1640 760 L1710 850 L1830 780"/>
  </g>
  <g fill="#0b0906" stroke="#0b0906" stroke-width="5">
    <rect x="280" y="500" width="16" height="300" fill="#16100b"/>
    <rect x="360" y="500" width="16" height="300" fill="#16100b"/>
    <rect x="270" y="515" width="120" height="16" fill="#16100b"/>
    <rect x="270" y="565" width="120" height="12" fill="#16100b"/>
    <path d="M280 500 L360 500 L420 560 L220 560 Z" fill="#8a3d25"/>
    <path d="M260 620 L440 620 L440 700 L260 700 Z" fill="#a7472b"/>
    <text x="350" y="665" text-anchor="middle" font-family="Impact, sans-serif" font-size="44" fill="#140d08" stroke="none">SECTOR 04</text>
  </g>

