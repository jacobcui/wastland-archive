<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151b28"/>
      <stop offset="0.38" stop-color="#244b51"/>
      <stop offset="0.68" stop-color="#7e7855"/>
      <stop offset="1" stop-color="#c18c48"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f4a3c"/>
      <stop offset="1" stop-color="#17130f"/>
    </linearGradient>
    <linearGradient id="car" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b74e2f"/>
      <stop offset="1" stop-color="#4d1d15"/>
    </linearGradient>
    <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#0c0906" opacity="0.5"/>
    </pattern>
    <pattern id="scratch" width="28" height="28" patternUnits="userSpaceOnUse" patternTransform="rotate(12)">
      <line x1="0" y1="0" x2="0" y2="28" stroke="#0c0906" stroke-width="1.4" opacity="0.3"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="11" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.10"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1550" cy="260" r="112" fill="#d8d0a5" stroke="#0b0906" stroke-width="10" opacity="0.95"/>
