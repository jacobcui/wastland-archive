  <path d="M0 760 L240 700 L470 760 L700 690 L930 770 L1160 700 L1400 775 L1640 710 L1920 770 L1920 1080 L0 1080 Z" fill="url(#ground)" stroke="#07050a" stroke-width="12"/>

