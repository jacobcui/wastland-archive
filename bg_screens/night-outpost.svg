<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c0b1c"/>
      <stop offset="0.45" stop-color="#241f43"/>
      <stop offset="0.75" stop-color="#5b3350"/>
      <stop offset="1" stop-color="#b26045"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#241b1a"/>
      <stop offset="1" stop-color="#080706"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffb000" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ff6a2a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff6a2a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.8" fill="#050408" opacity="0.55"/>
      <circle cx="10" cy="9" r="1" fill="#050408" opacity="0.4"/>
    </pattern>
    <pattern id="hatch" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(18)">
      <line x1="0" y1="0" x2="0" y2="22" stroke="#050408" stroke-width="1.6" opacity="0.4"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="23" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.1"/></feComponentTransfer>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#sky)"/>
  <circle cx="1440" cy="220" r="150" fill="#d9c9a1" stroke="#07050a" stroke-width="10"/>
