<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1714"/>
      <stop offset="0.4" stop-color="#294a31"/>
      <stop offset="0.7" stop-color="#728a3d"/>
      <stop offset="1" stop-color="#c0a33d"/>
    </linearGradient>
    <linearGradient id="acid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d7f252"/>
      <stop offset="0.5" stop-color="#6ea82f"/>
      <stop offset="1" stop-color="#1e3b1c"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5d4a32"/>
      <stop offset="1" stop-color="#17130d"/>
    </linearGradient>
    <pattern id="halftone" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#081008" opacity="0.55"/>
      <circle cx="9" cy="8" r="1" fill="#081008" opacity="0.4"/>
    </pattern>
    <pattern id="hatch" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <line x1="0" y1="0" x2="0" y2="24" stroke="#071008" stroke-width="1.8" opacity="0.45"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="19" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.11"/></feComponentTransfer>
    </filter>
  </defs>

