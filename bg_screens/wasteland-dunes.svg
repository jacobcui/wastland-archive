      <stop offset="0" stop-color="#241629"/>
      <stop offset="0.34" stop-color="#7d2d2b"/>
      <stop offset="0.62" stop-color="#e56b2c"/>
      <stop offset="0.82" stop-color="#f5b33c"/>
